<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>TP02</title>

    <!--
      viewport-fit=cover 로 노치 아래까지 칠한다. 안 쓰면 아이폰에서 위아래로
      검은 띠가 남는다. 대신 UI 가 노치에 물릴 수 있어 안전 영역을 따로 뺀다.
      interactive-widget 은 키보드가 떴을 때 화면을 줄이지 말라는 뜻이다 —
      이 게임엔 글자 입력이 없으므로 줄어들 이유가 없다.
    -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

    <!--
      홈 화면에 추가했을 때 브라우저 껍데기 없이 뜨게 한다.
      아이폰에서 주소줄과 아래 막대를 없애는 길은 이것뿐이다 — 사파리는
      비디오가 아닌 것에는 전체화면 API 를 안 준다(아이패드는 16.4부터 되지만
      아이폰은 아직 없다). apple- 접두사가 붙은 옛 이름도 같이 적는다.
      새 이름만 적으면 옛 iOS 에서 무시된다.
    -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TP02">
    <meta name="theme-color" content="#1a161e">

    <link rel="manifest" href="TemplateData/manifest.json">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>

      <!--
        전체화면 버튼. 스스로는 못 부른다 — 브라우저는 사용자가 누른 그
        순간에만 전체화면을 허락한다. 되는 기기에서만 나타난다.
      -->
      <button id="go-full" type="button" hidden>전체화면</button>

      <!--
        안전 영역을 재는 탐침. CSS 만 env(safe-area-inset-*) 를 알고 있어서,
        그 값을 화면에 안 그리는 칸의 크기로 바꿔 놓고 자바스크립트가 읽는다.
        getComputedStyle 로 env() 를 바로 읽을 수는 없다 — 계산된 값에만 남는다.
      -->
      <div id="safe-probe" aria-hidden="true"></div>

      <!--
        세로로 들었을 때 덮는 판.

        화면 잠금(screen.orientation.lock)은 안드로이드에서 전체화면일 때만
        되고, 아이폰 사파리는 아예 안 준다. 그래서 마지막 수단이 필요하다 —
        돌려 달라고 말하고 그때까지 가린다. 가리는 것이 곧 잠그는 것이다.
      -->
      <div id="turn-me">
        <div class="mark">⟳</div>
        <p>가로로 돌려 주세요</p>
      </div>

      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var full = document.querySelector("#go-full");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.className = type === "error" ? "bad" : "warn";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type !== "error") setTimeout(function () {
          banner.removeChild(div);
          if (!banner.children.length) banner.style.display = "none";
        }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/TP02.data?v=91c04ca13eb6",
        frameworkUrl: buildUrl + "/TP02.framework.js?v=91c04ca13eb6",
        codeUrl: buildUrl + "/TP02.wasm?v=91c04ca13eb6",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Jongseung",
        productName: "TP02",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // 덮는 판은 폰에서만 뜬다. 데스크톱에서 창을 좁게 잡은 것을 "세로로
      // 들었다" 로 읽으면, 돌릴 수 없는 화면에 돌리라는 말이 뜬다.
      if (mobile) document.body.classList.add("on-phone");

      if (!mobile) {
        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }

      // 이미 홈 화면 앱으로 뜬 상태인가. 그러면 껍데기가 없으므로 버튼이 필요 없다
      function standalone() {
        return window.navigator.standalone === true ||
               window.matchMedia("(display-mode: standalone)").matches;
      }

      // 전체화면을 걸 수 있는 기기인가. 사파리(아이폰)는 여기서 false 가 된다
      var target = document.documentElement;
      var canFull = !!(target.requestFullscreen || target.webkitRequestFullscreen);

      // 가로로 잠근다. 전체화면 안에서만 허락되고, 아이폰 사파리는 아예 안 준다.
      // 안 되는 곳에서도 던지지 않게 삼킨다 — 여기서 터지면 게임이 시작되기 전에
      // 멈춘다. 못 잠그는 기기는 세로일 때 덮는 판이 받는다.
      function lockLandscape() {
        try {
          if (screen.orientation && screen.orientation.lock)
            Promise.resolve(screen.orientation.lock("landscape")).catch(function () {});
        } catch (e) {}
      }

      function enterFullscreen() {
        var go = target.requestFullscreen || target.webkitRequestFullscreen;
        if (!go) return;

        // 순서를 바꾸면 조용히 거절당한다. 전체화면이 먼저다.
        Promise.resolve(go.call(target)).then(lockLandscape).catch(function () {});
      }

      function refreshButton() {
        var on = document.fullscreenElement || document.webkitFullscreenElement;
        full.hidden = !canFull || standalone() || !!on;
      }

      full.addEventListener("click", enterFullscreen);
      document.addEventListener("fullscreenchange", refreshButton);
      document.addEventListener("webkitfullscreenchange", refreshButton);
      refreshButton();

      // 홈 화면 앱으로 띄웠으면 이미 껍데기가 없다. 그때는 누를 것 없이 바로
      // 잠근다 — manifest 의 orientation 이 안 먹는 브라우저를 위한 두 번째 손이다.
      if (standalone()) lockLandscape();

      // 캔버스를 처음 만질 때도 들어간다. 버튼을 못 보고 지나치는 사람이 많고,
      // 어차피 게임을 시작하려면 화면을 한 번은 만진다. 딱 한 번만 건다 —
      // 나가고 싶어서 빠져나온 사람을 다시 끌고 들어가면 갇힌 것이 된다.
      canvas.addEventListener("pointerdown", function once() {
        canvas.removeEventListener("pointerdown", once);
        if (canFull && !standalone()) enterFullscreen();
      });

      // 주소줄을 밀어내려는 옛 수법(scrollTo)은 요즘 브라우저에서 안 먹는다.
      // 대신 페이지가 아예 안 스크롤되게 막아 둔다 — 끌어당길 때 화면이
      // 통째로 밀리면 조준이 어긋난다.
      document.addEventListener("touchmove", function (e) {
        if (e.touches.length > 1) e.preventDefault();   // 두 손가락 확대 막기
      }, { passive: false });

      /*
        노치와 손잡이 막대를 피할 여백을 유니티에 알려 준다.

        Unity 의 Screen.safeArea 는 WebGL 에서 늘 화면 전체를 돌려준다 —
        브라우저가 그 값을 엔진에 안 넘긴다. 그래서 페이지가 재서 보낸다.

        픽셀이 아니라 비율(0~1)로 보낸다. 픽셀로 주고받으면 CSS 픽셀·기기
        픽셀·캔버스 단위 셋을 환산해야 하는데, 그 환산은 기기마다 어긋나기
        쉽고 어긋난 것이 눈에 잘 안 띈다.
      */
      var probe = document.querySelector("#safe-probe");
      var game = null;

      function sendInsets() {
        if (!game) return;

        var box = probe.getBoundingClientRect();     // 탐침이 놓인 자리 = 안전 영역
        var w = window.innerWidth, h = window.innerHeight;
        if (w <= 0 || h <= 0) return;

        var t = box.top / h;
        var l = box.left / w;
        var r = (w - box.right) / w;
        var b = (h - box.bottom) / h;

        try {
          game.SendMessage("SafeArea", "SetInsets",
                           t.toFixed(4) + "," + r.toFixed(4) + "," + b.toFixed(4) + "," + l.toFixed(4));
        } catch (e) {}
      }

      // 화면이 달라질 만한 일마다 다시 잰다. 가로세로를 돌리면 노치가 있는 쪽이
      // 바뀌고, 전체화면을 들고 날 때도 여백이 통째로 달라진다.
      ["resize", "orientationchange", "fullscreenchange", "webkitfullscreenchange"]
        .forEach(function (ev) { window.addEventListener(ev, function () { setTimeout(sendInsets, 100); }); });

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = buildUrl + "/TP02.loader.js?v=91c04ca13eb6";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * p + "%";
        }).then(function (instance) {
          game = instance;
          document.querySelector("#unity-loading-bar").style.display = "none";

          // 첫 번은 조금 늦춘다. 유니티가 첫 씬을 올리기 전에 보내면
          // 받을 오브젝트가 아직 없어서 조용히 버려진다.
          setTimeout(sendInsets, 200);
          setTimeout(sendInsets, 1200);
        }).catch(function (msg) { alert(msg); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
